name: Build Android APK V2.4 FULL
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble full V2.4 source
        run: cat src_parts/part1.txt src_parts/part2.txt src_parts/part3a.txt src_parts/part3b.txt src_parts/part3c.txt src_parts/part3d.txt > main.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Compile full application
        run: python -m py_compile main.py
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble full V2.4 source
        run: cat src_parts/part1.txt src_parts/part2.txt src_parts/part3a.txt src_parts/part3b.txt src_parts/part3c.txt src_parts/part3d.txt > main.py
      - name: Verify test placeholder is absent
        run: "! grep -q 'Android build initialized' main.py"
      - name: Build full debug APK
        run: printf 'y\n' | buildozer android debug
      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: Mazda6GH-AsBuilt-Studio-Android-V2.4-FULL-APK
          path: bin/*.apk
          if-no-files-found: error
