name: Build Run22 Licensed APKs
on:
  workflow_dispatch:
  push:
    branches: [ run22-offline-license ]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile main.py license_core.py admin_keygen.py

  client:
    needs: test
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate brand assets
        run: |
          python3 -m pip install --quiet pillow
          python3 generate_brand_assets.py
      - name: Build Run22 client
        run: printf 'y\n' | buildozer android debug
      - name: Upload Run22 client APK
        uses: actions/upload-artifact@v4
        with:
          name: Mazda6GH-AsBuilt-Studio-Run22-Licensed
          path: bin/*.apk
          if-no-files-found: error

  admin:
    needs: test
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Admin app
        run: |
          cp main.py main_client.py
          cp admin_keygen.py main.py
          sed -i 's/title = Mazda 6 GH As-Built Studio/title = M6GH License Admin/' buildozer.spec
          sed -i 's/package.name = mazda6ghasbuilt/package.name = m6ghlicenseadmin/' buildozer.spec
          sed -i 's/version = 2.4/version = 22.0/' buildozer.spec
          sed -i '/icon.filename/d' buildozer.spec
          sed -i '/presplash.filename/d' buildozer.spec
      - name: Build Admin
        run: printf 'y\n' | buildozer android debug
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: M6GH-Run22-License-Admin
          path: bin/*.apk
          if-no-files-found: error
