name: Build Run70 Licensed APK
on:
  workflow_dispatch:
  push:
    branches: [ run70-licensed-from-run69 ]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Run70 source
        run: cat src_parts/part1.txt src_parts/part2.txt src_parts/part3a.txt src_parts/part3b.txt src_parts/part3c.txt src_parts/part3d.txt > main.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile main.py license_core.py

  client:
    needs: test
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Run70 source
        run: cat src_parts/part1.txt src_parts/part2.txt src_parts/part3a.txt src_parts/part3b.txt src_parts/part3c.txt src_parts/part3d.txt > main.py
      - name: Generate brand assets
        run: |
          python3 -m pip install --quiet pillow
          python3 generate_brand_assets.py
      - name: Build Run70 client
        run: printf 'y\n' | buildozer android debug
      - name: Upload Run70 client APK
        uses: actions/upload-artifact@v4
        with:
          name: Mazda6GH-AsBuilt-Studio-Run70-Licensed
          path: bin/*.apk
          if-no-files-found: error
