name: Build Run84 Licensed APKs
on:
  workflow_dispatch:
  push:
    branches: [ run84-licensed ]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Run84 source
        run: cat src_parts/part1.txt src_parts/part2.txt src_parts/part3a.txt src_parts/part3b.txt src_parts/part3c.txt src_parts/part3d.txt > main.py
      - name: Validate Run84 source integrity
        run: |
          grep -q 'class MazdaAndroidApp' main.py
          grep -q 'def parse_abt' main.py
          grep -q 'def admin_panel' main.py
          grep -q 'RVM / контроль слепых зон' main.py
          grep -q 'Keyless-ON' main.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile main.py license_core.py
      - name: Run84 license verifier tests
        run: |
          python - <<'PY'
          from license_core import device_code, verify_activation
          a=device_code("phone-A")
          b=device_code("phone-B")
          assert a != b
          assert not verify_activation(a,"")
          assert not verify_activation(a,"not-a-license")
          assert not verify_activation(b,"not-a-license")
          assert device_code("phone-A") == a
          assert device_code("phone-B") == b
          print("Run84 license gate basic tests: OK")
          PY

  client:
    needs: test
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Run84 source
        run: cat src_parts/part1.txt src_parts/part2.txt src_parts/part3a.txt src_parts/part3b.txt src_parts/part3c.txt src_parts/part3d.txt > main.py
      - name: Generate brand assets
        run: |
          python3 -m pip install --quiet pillow
          python3 generate_brand_assets.py
      - name: Build Run84 Licensed client
        run: printf 'y\n' | buildozer android debug
      - name: Upload Run84 Licensed APK
        uses: actions/upload-artifact@v4
        with:
          name: Mazda6GH-AsBuilt-Studio-Run84-Licensed
          path: bin/*.apk
          if-no-files-found: error
